name: code-quality

on: [push, pull_request]

jobs:
  run-linter:
    name: run linter

    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs rather than tags. A tag is mutable:
      # whoever controls it can change what runs in CI on every push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Was chartboost/ruff-action@v1 — a third-party action, archived upstream
      # since 2024-10-09 and referenced by a mutable tag. astral-sh/ruff-action
      # is the first-party equivalent from the tool vendor. It reads the pinned
      # ruff version from pyproject.toml so CI and local dev run the same
      # linter, and it runs on node24 (the old action forced a Node 20 shim).
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: pyproject.toml
