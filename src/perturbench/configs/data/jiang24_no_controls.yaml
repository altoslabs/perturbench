defaults:
  - transform: linear_model_pipeline
  - splitter: saved_split
  - evaluation: default

# The type of data module to use
_target_: perturbench.data.modules.AnnDataLitModule

# Arguments to the data accessor
data:
  filename: ${paths.data_dir}/jiang24_processed.h5ad

# Arguments to the data iterator (dataset/datapipe)
data_iter_factory:
  _target_: perturbench.data.datasets.SingleCellPerturbation.from_anndata
  _partial_: True
  perturbation_key: condition
  perturbation_combination_delimiter: +
  perturbation_control_value: control
  covariate_keys: [cell_type,treatment]
  embedding_key: null
  feature_filter_path: null

mode: batch
loader:
  batch_size: 2000
  num_workers: 8

splitter:
  split_path: ${paths.data_dir}/jiang24_split.csv
